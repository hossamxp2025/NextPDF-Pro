<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="redBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4747"/>
      <stop offset="100%" stop-color="#c60000"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef0f3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="bluePen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>

  <!-- خلفية حمراء لامعة بزوايا دائرية كبيرة -->
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#redBg)"/>

  <!-- الزخرفة الذهبية المنحنية حول المستند (شريط ذهبي ملتف) -->
  <path d="M42 128 Q24 100 126 38 Q232 38 208 140" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <path d="M126 38 Q232 38 208 140 Q176 212 96 164" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>

  <!-- مستند PDF أبيض مع زاوية مطوية أعلى اليمين -->
  <path d="M64 34 L190 34 L190 14 L212 36 L228 188 L64 188 Z" fill="url(#paper)" stroke="#c8c8c8" stroke-width="2"/>

  <!-- ظل الطبقة المطوية -->
  <path d="M190 14 L212 36 L228 188" fill="#d9d9d9"/>

  <!-- خطوط تمثيلية للنص في الجزء العلوي من المستند -->
  <line x1="82" y1="70" x2="182" y2="70" stroke="#c4c4c4" stroke-width="6" stroke-linecap="round"/>
  <line x1="82" y1="88" x2="164" y2="88" stroke="#c4c4c4" stroke-width="6" stroke-linecap="round"/>
  <line x1="82" y1="106" x2="148" y2="106" stroke="#c4c4c4" stroke-width="6" stroke-linecap="round"/>

  <!-- شريط PDF الأحمر في منتصف المستند -->
  <rect x="72" y="116" width="120" height="48" rx="10" fill="#c60000"/>

  <!-- حروف PDF بيضاء، مرسومة كخطوط (stroke) لا كمساحات: الحروف المصمتة كانت
       تنهار إلى أشكال غير مقروءة، والخط المرسوم يبقى واضحًا عند كل المقاسات
       وبلا اعتماد على خطوط النظام -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- P -->
    <path d="M90 156 V124 h10 a9 9 0 0 1 0 18 h-10"/>
    <!-- D -->
    <path d="M120 124 v32 h8 a16 16 0 0 0 0 -32 z"/>
    <!-- F -->
    <path d="M154 156 V124 h18 M154 140 h14"/>
  </g>

  <!-- خط أحمر رفيع أسفل PDF -->
  <line x1="92" y1="174" x2="172" y2="174" stroke="#c60000" stroke-width="4" stroke-linecap="round"/>

  <!-- القلم الأزرق مع رأس ذهبي، مائل من الأعلى اليمنى إلى الأسفل اليسرى -->
  <g transform="translate(184 96) rotate(-40)">
    <!-- برميل القلم الأزرق -->
    <rect x="-8" y="-22" width="16" height="64" rx="4" fill="url(#bluePen)" stroke="#002244" stroke-width="1"/>
    <!-- المرحلة الذهبية أعلى القلم -->
    <rect x="-8" y="-22" width="16" height="9" rx="3" fill="#d4af37"/>
    <!-- رأس القلم الذهبي -->
    <path d="M-4 42 L4 58 L-4 74 Z" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
    <!-- نقطة الحبر -->
    <circle cx="-2" cy="62" r="2.5" fill="#4a2c00"/>
    <!-- لمعان على القلم -->
    <path d="M-6 -20 L-2 -16 L-6 -12" fill="none" stroke="#fff8bf" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- شريط Pro الذهبي في الأسفل الأيمن -->
  <path d="M132 192 Q164 192 174 208 Q194 224 224 220 L232 196 Q204 176 172 172 Z" fill="url(#gold)"/>

  <!-- كلمة Pro على الشريط الذهبي، مرسومة كخطوط ومائلة مع ميل الشريط.
       كانت مساحات مصمتة تخرج كبقع بنية غير مقروءة -->
  <g transform="rotate(-11 202 203)"
     fill="none" stroke="#7a3e00" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- P -->
    <path d="M184 214 V196 h6 a5 5 0 0 1 0 10 h-6"/>
    <!-- r -->
    <path d="M200 214 v-12 M200 206 a6 6 0 0 1 6 -4"/>
    <!-- o -->
    <path d="M216 202 a6 6 0 0 1 0 12 a6 6 0 0 1 0 -12 z"/>
  </g>
</svg>
